spring.application.name=acecircuit-backend
server.port=8080

# PostgreSQL - We'll use Railway for deployment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acecircuit}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:acecircuit-super-secret-jwt-key-2024-very-long-string}
jwt.expiration=86400000

# Groq AI
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379